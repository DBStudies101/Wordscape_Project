<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3436">
  <meta name="description" content="A calm word puzzle: swipe letters to fill the crossword.">
  <title>Wordscape</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="game">
    <header class="top">
      <h1 class="mark">Wordscape</h1>
      <div class="stats">
        <span id="level">Level 1</span>
        <span id="bonus">Bonus 0</span>
        <button id="mute" class="icon" type="button" aria-label="Turn sound off" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5 6 9H2v6h4l5 4V5Z"/>
            <g class="waves"><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></g>
            <g class="cross"><path d="m22 9-6 6"/><path d="m16 9 6 6"/></g>
          </svg>
        </button>
      </div>
    </header>

    <section class="stage" aria-label="Crossword">
      <div id="board" class="board"></div>
    </section>

    <section class="play">
      <div id="dial" class="dial">
        <div id="wheel" class="wheel" aria-label="Letter wheel"></div>
        <button id="shuffle" class="core shuffle" type="button" aria-label="Shuffle letters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/>
            <path d="m18 2 4 4-4 4"/>
            <path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/>
            <path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/>
            <path d="m18 14 4 4-4 4"/>
          </svg>
        </button>
        <div id="preview" class="core word" aria-live="polite"></div>
      </div>

      <p id="status" class="status" aria-live="polite"></p>

      <div class="actions">
        <button id="new-puzzle" class="quiet" type="button">New puzzle</button>
        <button id="next" class="primary" type="button" hidden>Next level</button>
      </div>
    </section>

    <footer class="foot">
      <a href="https://github.com/DBStudies101/Wordscape_Project" target="_blank" rel="noopener">View the source on GitHub</a>
    </footer>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
